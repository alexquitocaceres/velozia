<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velozia · Evaluación del curso</title>
<style>
  :root {
    --v-blue-dark: #0a1e3c;
    --v-blue: #10305c;
    --v-blue-light: #1c4a86;
    --v-green: #3fae4a;
    --v-green-dark: #2e8a38;
    --v-white: #ffffff;
    --v-gray: #cbd6e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, var(--v-blue-dark), var(--v-blue) 60%, var(--v-blue-light));
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--v-white);
    padding: 20px;
  }
  .card {
    background: rgba(10, 30, 60, 0.55);
    border: 1px solid rgba(63, 174, 74, 0.35);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
  }
  .logo {
    display: block;
    max-width: 260px;
    margin: 0 auto 28px auto;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 6px 0;
    color: var(--v-white);
  }
  .subtitle {
    text-align: center;
    color: var(--v-gray);
    font-size: 13px;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--v-gray);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: var(--v-white);
    font-size: 15px;
    outline: none;
  }
  input[type="text"]:focus, input[type="password"]:focus {
    border-color: var(--v-green);
  }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 42px; }
  .eye-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    color: var(--v-gray);
  }
  .eye-btn:hover { color: var(--v-green); }
  .eye-btn svg { width: 20px; height: 20px; display: block; }
  button.primary {
    width: 100%;
    margin-top: 26px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--v-green), var(--v-green-dark));
    color: var(--v-white);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  button.primary:hover { filter: brightness(1.08); }
  .error-msg {
    color: #ff8a8a;
    font-size: 13px;
    text-align: center;
    margin-top: 14px;
    min-height: 16px;
  }
  .hidden { display: none !important; }

  /* Quiz page */
  .quiz-shell {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
  }
  .quiz-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 22px;
  }
  .quiz-header img { height: 40px; }
  .quiz-header .titles h2 { margin: 0; font-size: 18px; }
  .quiz-header .titles p { margin: 2px 0 0 0; font-size: 12px; color: var(--v-gray); }
  .progress-track {
    height: 6px;
    background: rgba(255,255,255,0.12);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 26px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--v-green), #6fd67a);
    transition: width 0.3s ease;
  }
  .q-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .q-card .q-meta {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--v-green);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .q-card .q-text {
    font-size: 15px;
    line-height: 1.45;
    margin-bottom: 14px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .option:hover { background: rgba(255,255,255,0.06); }
  .option input { margin-top: 3px; accent-color: var(--v-green); }
  .option span { font-size: 14px; line-height: 1.4; }
  .option.correct { background: rgba(63,174,74,0.22); border-color: var(--v-green); }
  .option.incorrect { background: rgba(255,90,90,0.18); border-color: #ff5a5a; }

  .submit-bar {
    display: flex;
    justify-content: center;
    margin: 24px 0 40px 0;
  }
  .submit-bar button {
    padding: 13px 34px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--v-green), var(--v-green-dark));
    color: var(--v-white);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .submit-bar button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .results-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 30px;
    text-align: center;
    margin-bottom: 24px;
  }
  .results-score {
    font-size: 44px;
    font-weight: 700;
    margin: 10px 0;
  }
  .results-score.pass { color: var(--v-green); }
  .results-score.fail { color: #ff8a8a; }
  .results-tag {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    margin-top: 6px;
  }
  .results-tag.pass { background: rgba(63,174,74,0.2); color: #6fd67a; }
  .results-tag.fail { background: rgba(255,90,90,0.2); color: #ff8a8a; }

  footer.brand-footer {
    text-align: center;
    font-size: 11px;
    color: var(--v-gray);
    opacity: 0.6;
    margin-top: 30px;
  }
</style>
</head>

  const QUESTIONS = [{"block": "Bloque 1", "text": "La automatización con IA generativa sigue exactamente las mismas reglas fijas que la automatización tradicional (RPA/macros).", "type": "vf", "options": ["Verdadero", "Falso"], "correct": 1}, {"block": "Bloque 2", "text": "¿Cuál de los siguientes NO es un criterio recomendado para priorizar qué proceso automatizar primero?", "type": "mc", "options": ["Frecuencia con la que se realiza la tarea", "Impacto o riesgo si el resultado tiene un error", "El color corporativo de la institución", "Tiempo que actualmente consume la tarea"], "correct": 2}, {"block": "Bloque 4", "text": "El resultado de una herramienta de IA generativa puede publicarse o enviarse directamente sin revisión humana, siempre que el prompt haya sido claro.", "type": "vf", "options": ["Verdadero", "Falso"], "correct": 1}, {"block": "Bloque 4", "text": "¿Qué tipo de información NO debe subirse a una herramienta de IA generativa pública, según lo visto en el curso?", "type": "mc", "options": ["Un texto de prueba genérico", "Datos personales de terceros o información clasificada", "Un ejemplo de oficio ficticio", "Una pregunta general sobre redacción"], "correct": 1}, {"block": "Bloque 4", "text": "Las “alucinaciones” en IA generativa se refieren a cuando la herramienta genera información falsa o inventada con apariencia de certeza.", "type": "vf", "options": ["Verdadero", "Falso"], "correct": 0}, {"block": "Bloque 2", "text": "Un buen candidato para automatizar con IA generativa es una tarea que:", "type": "mc", "options": ["Requiere juicio legal complejo sin posibilidad de revisión", "Es frecuente, de bajo riesgo si se revisa, y consume tiempo en redactar o resumir", "Maneja información clasificada de alta sensibilidad", "Se realiza una sola vez al año"], "correct": 1}, {"block": "Bloque 4", "text": "Los sesgos en los resultados de una IA generativa son imposibles porque la herramienta es neutral por diseño.", "type": "vf", "options": ["Verdadero", "Falso"], "correct": 1}, {"block": "Bloque 3", "text": "¿Cuál de estas es una tarea administrativa que se trabajó como ejemplo durante el curso?", "type": "mc", "options": ["Resumen de documentos extensos", "Reparación de equipos de cómputo", "Diseño de infraestructura de red", "Contabilidad tributaria avanzada"], "correct": 0}, {"block": "Bloque 5", "text": "Un “plan de acción” al final del curso consiste en identificar un proceso concreto del propio puesto de trabajo, la herramienta a usar, y el tiempo estimado que se ahorraría.", "type": "vf", "options": ["Verdadero", "Falso"], "correct": 0}, {"block": "Bloque 1", "text": "¿Cuál es la diferencia principal entre automatización tradicional (RPA/macros) y automatización con IA generativa?", "type": "mc", "options": ["La IA generativa es siempre más barata", "La automatización tradicional sigue reglas fijas y estructuradas; la IA generativa interpreta lenguaje natural y se adapta, pero no es determinística", "No existe ninguna diferencia relevante", "La automatización tradicional solo funciona en Excel"], "correct": 1}];

      card.className = 'q-card';
      card.id = 'q-card-' + qi;

      const meta = document.createElement('div');
      meta.className = 'q-meta';
      meta.textContent = 'Pregunta ' + (qi + 1) + ' de ' + QUESTIONS.length + ' · ' + q.block;
      card.appendChild(meta);

      const text = document.createElement('div');
      text.className = 'q-text';
      text.textContent = q.text;
      card.appendChild(text);

      q.options.forEach((opt, oi) => {
        const label = document.createElement('label');
        label.className = 'option';
        label.id = 'opt-' + qi + '-' + oi;
        const input = document.createElement('input');
        input.type = 'radio';
        input.name = 'q' + qi;
        input.value = oi;
        input.addEventListener('change', () => {
          answers[qi] = oi;
          updateProgress();
        });
        const span = document.createElement('span');
        span.textContent = opt;
        label.appendChild(input);
        label.appendChild(span);
        card.appendChild(label);
      });

      container.appendChild(card);
    });
    updateProgress();
  }

  function updateProgress() {
    const answered = answers.filter(a => a !== null).length;
    const pct = Math.round((answered / QUESTIONS.length) * 100);
    progressFill.style.width = pct + '%';
    submitBtn.disabled = answered < QUESTIONS.length;
  }

  submitBtn.addEventListener('click', () => {
    let score = 0;
    QUESTIONS.forEach((q, qi) => {
      const userAnswer = answers[qi];
      const correctOpt = document.getElementById('opt-' + qi + '-' + q.correct);
      correctOpt.classList.add('correct');
      if (userAnswer === q.correct) {
        score++;
      } else if (userAnswer !== null) {
        document.getElementById('opt-' + qi + '-' + userAnswer).classList.add('incorrect');
      }
      // disable further changes
      document.querySelectorAll('input[name="q' + qi + '"]').forEach(i => i.disabled = true);
    });

    submitBtn.disabled = true;
    submitBtn.textContent = 'Respuestas enviadas';

    const resultsCard = document.getElementById('resultsCard');
    const resultsScore = document.getElementById('resultsScore');
    const resultsTag = document.getElementById('resultsTag');
    resultsCard.classList.remove('hidden');
    resultsScore.textContent = score + '/' + QUESTIONS.length;
    const passed = score >= 7;
    resultsScore.className = 'results-score ' + (passed ? 'pass' : 'fail');
    resultsTag.className = 'results-tag ' + (passed ? 'pass' : 'fail');
    resultsTag.textContent = passed ? 'Aprobado' : 'No aprobado — revisa las respuestas marcadas en rojo';
    resultsCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
</script>
</body>
</html>
