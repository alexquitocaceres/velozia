<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velozia · Evaluación del curso</title>
<style>
  :root {
    --v-blue-dark: #0a1e3c;
    --v-blue: #10305c;
    --v-blue-light: #1c4a86;
    --v-green: #3fae4a;
    --v-green-dark: #2e8a38;
    --v-white: #ffffff;
    --v-gray: #cbd6e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, var(--v-blue-dark), var(--v-blue) 60%, var(--v-blue-light));
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--v-white);
    padding: 20px;
  }
  .card {
    background: rgba(10, 30, 60, 0.55);
    border: 1px solid rgba(63, 174, 74, 0.35);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
  }
  .logo {
    display: block;
    max-width: 260px;
    margin: 0 auto 28px auto;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 6px 0;
    color: var(--v-white);
  }
  .subtitle {
    text-align: center;
    color: var(--v-gray);
    font-size: 13px;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--v-gray);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: var(--v-white);
    font-size: 15px;
    outline: none;
  }
  input[type="text"]:focus, input[type="password"]:focus {
    border-color: var(--v-green);
  }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 42px; }
  .eye-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    color: var(--v-gray);
  }
  .eye-btn:hover { color: var(--v-green); }
  .eye-btn svg { width: 20px; height: 20px; display: block; }
  button.primary {
    width: 100%;
    margin-top: 26px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--v-green), var(--v-green-dark));
    color: var(--v-white);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  button.primary:hover { filter: brightness(1.08); }
  .error-msg {
    color: #ff8a8a;
    font-size: 13px;
    text-align: center;
    margin-top: 14px;
    min-height: 16px;
  }
  .hidden { display: none !important; }
  /* Quiz page */
  .quiz-shell {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
  }
  .quiz-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 22px;
  }
  .quiz-header img { height: 40px; }
  .quiz-header .titles h2 { margin: 0; font-size: 18px; }
  .quiz-header .titles p { margin: 2px 0 0 0; font-size: 12px; color: var(--v-gray); }
  .progress-track {
    height: 6px;
    background: rgba(255,255,255,0.12);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 26px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--v-green), #6fd67a);
    transition: width 0.3s ease;
  }
  .q-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .q-card .q-meta {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--v-green);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .q-card .q-text {
    font-size: 15px;
    line-height: 1.45;
    margin-bottom: 14px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .option:hover { background: rgba(255,255,255,0.06); }
  .option input { margin-top: 3px; accent-color: var(--v-green); }
  .option span { font-size: 14px; line-height: 1.4; }
  .option.correct { background: rgba(63,174,74,0.22); border-color: var(--v-green); }
  .option.incorrect { background: rgba(255,90,90,0.18); border-color: #ff5a5a; }
  .submit-bar {
    display: flex;
    justify-content: center;
    margin: 24px 0 40px 0;
  }
  .submit-bar button {
    padding: 13px 34px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--v-green), var(--v-green-dark));
    color: var(--v-white);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .submit-bar button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .results-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 30px;
    text-align: center;
    margin-bottom: 24px;
  }
  .results-score {
    font-size: 44px;
    font-weight: 700;
    margin: 10px 0;
  }
  .results-score.pass { color: var(--v-green); }
  .results-score.fail { color: #ff8a8a; }
  .results-tag {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    margin-top: 6px;
  }
  .results-tag.pass { background: rgba(63,174,74,0.2); color: #6fd67a; }
  .results-tag.fail { background: rgba(255,90,90,0.2); color: #ff8a8a; }
  footer.brand-footer {
    text-align: center;
    font-size: 11px;
    color: var(--v-gray);
    opacity: 0.6;
    margin-top: 30px;
  }
</style>
</head>

  const eyeIcon = document.getElementById('eyeIcon');
  const eyeOpen = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle>';
  const eyeClosed = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.8 21.8 0 0 1 5.06-6.06"></path><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.8 21.8 0 0 1-2.16 3.19"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
  toggleEye.addEventListener('click', () => {
    const showing = pwInput.type === 'text';
    pwInput.type = showing ? 'password' : 'text';
    eyeIcon.innerHTML = showing ? eyeOpen : eyeClosed;
    toggleEye.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
  });
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const loginCard = document.getElementById('loginCard');
  const quizShell = document.getElementById('quizShell');
  function attemptLogin() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    if (u === VALID_USER && p === VALID_PASS) {
      loginError.textContent = '';
      loginCard.classList.add('hidden');
      quizShell.classList.remove('hidden');
      buildQuiz();
    } else {
      loginError.textContent = 'Usuario o contraseña incorrectos.';
    }
  }
  loginBtn.addEventListener('click', attemptLogin);
  document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
  document.getElementById('username').addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
  const answers = new Array(QUESTIONS.length).fill(null);
  const container = document.getElementById('questionsContainer');
  const submitBtn = document.getElementById('submitBtn');
  const progressFill = document.getElementById('progressFill');
  function buildQuiz() {
    container.innerHTML = '';
    QUESTIONS.forEach((q, qi) => {
      const card = document.createElement('div');
      card.className = 'q-card';
      card.id = 'q-card-' + qi;
      const meta = document.createElement('div');
      meta.className = 'q-meta';
      meta.textContent = 'Pregunta ' + (qi + 1) + ' de ' + QUESTIONS.length + ' · ' + q.block;
      card.appendChild(meta);
      const text = document.createElement('div');
      text.className = 'q-text';
      text.textContent = q.text;
      card.appendChild(text);
      q.options.forEach((opt, oi) => {
        const label = document.createElement('label');
        label.className = 'option';
        label.id = 'opt-' + qi + '-' + oi;
        const input = document.createElement('input');
        input.type = 'radio';
        input.name = 'q' + qi;
        input.value = oi;
        input.addEventListener('change', () => {
          answers[qi] = oi;
          updateProgress();
        });
        const span = document.createElement('span');
        span.textContent = opt;
        label.appendChild(input);
        label.appendChild(span);
        card.appendChild(label);
      });
      container.appendChild(card);
    });
    updateProgress();
  }
  function updateProgress() {
    const answered = answers.filter(a => a !== null).length;
    const pct = Math.round((answered / QUESTIONS.length) * 100);
    progressFill.style.width = pct + '%';
    submitBtn.disabled = answered < QUESTIONS.length;
  }
  submitBtn.addEventListener('click', () => {
    let score = 0;
    QUESTIONS.forEach((q, qi) => {
      const userAnswer = answers[qi];
      const correctOpt = document.getElementById('opt-' + qi + '-' + q.correct);
      correctOpt.classList.add('correct');
      if (userAnswer === q.correct) {
        score++;
      } else if (userAnswer !== null) {
        document.getElementById('opt-' + qi + '-' + userAnswer).classList.add('incorrect');
      }
      document.querySelectorAll('input[name="q' + qi + '"]').forEach(i => i.disabled = true);
    });
    submitBtn.disabled = true;
    submitBtn.textContent = 'Respuestas enviadas';
    const resultsCard = document.getElementById('resultsCard');
    const resultsScore = document.getElementById('resultsScore');
    const resultsTag = document.getElementById('resultsTag');
    resultsCard.classList.remove('hidden');
    resultsScore.textContent = score + '/' + QUESTIONS.length;
    const passed = score >= 7;
    resultsScore.className = 'results-score ' + (passed ? 'pass' : 'fail');
    resultsTag.className = 'results-tag ' + (passed ? 'pass' : 'fail');
    resultsTag.textContent = passed ? 'Aprobado' : 'No aprobado — revisa las respuestas marcadas en rojo';
    resultsCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
</script>
</body>
</html>
