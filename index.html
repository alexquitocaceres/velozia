<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuestionario de Exploración Espacial</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: rgba(255, 255, 255, 0.9);
        --panel-strong: #ffffff;
        --text: #111827;
        --muted: #5b6477;
        --primary: #5b7cff;
        --primary-strong: #405fe5;
        --success: #18b76b;
        --success-soft: #dff9ee;
        --danger: #ef4a59;
        --danger-soft: #ffe5e9;
        --border: rgba(17, 24, 39, 0.08);
        --shadow: 0 18px 40px rgba(47, 72, 125, 0.12);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #07111d;
          --panel: rgba(15, 23, 35, 0.9);
          --panel-strong: #0f1b2b;
          --text: #edf3ff;
          --muted: #a9b7d1;
          --primary: #7da2ff;
          --primary-strong: #9db8ff;
          --success: #4ade80;
          --success-soft: rgba(74, 222, 128, 0.12);
          --danger: #ff6b7d;
          --danger-soft: rgba(255, 107, 125, 0.12);
          --border: rgba(255, 255, 255, 0.08);
          --shadow: 0 18px 40px rgba(2, 6, 18, 0.5);
        }
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(91, 124, 255, 0.18), transparent 30%),
          linear-gradient(180deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 96%, #dfe8ff 4%) 100%);
        color: var(--text);
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 18px;
      }

      .app {
        width: min(100%, 520px);
      }

      .card {
        background: var(--panel);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        border-radius: 24px;
        overflow: hidden;
      }

      .header {
        padding: 18px 20px 12px;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(91, 124, 255, 0.1);
        color: var(--primary-strong);
        font-weight: 800;
        font-size: 0.78rem;
        letter-spacing: 0.02em;
      }

      .score {
        color: var(--muted);
        font-weight: 800;
        font-size: 0.9rem;
      }

      .progress-wrap {
        width: 100%;
        height: 12px;
        background: rgba(128, 142, 170, 0.18);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #7fa3ff 0%, #5b7cff 35%, #4d8df2 100%);
        transition: width 0.35s ease;
      }

      .content {
        padding: 18px 20px 22px;
      }

      .question-title {
        margin: 0 0 18px;
        font-size: clamp(1.5rem, 3vw, 2.1rem);
        letter-spacing: -0.04em;
        line-height: 1.2;
      }

      .options {
        display: grid;
        gap: 12px;
      }

      .option {
        width: 100%;
        padding: 14px 16px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: var(--panel-strong);
        color: var(--text);
        text-align: left;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .option:hover {
        transform: translateY(-1px);
        border-color: rgba(91, 124, 255, 0.35);
        box-shadow: 0 8px 20px rgba(91, 124, 255, 0.08);
      }

      .option:focus-visible {
        outline: 3px solid rgba(91, 124, 255, 0.25);
        outline-offset: 2px;
      }

      .option.correct {
        background: var(--success-soft);
        border-color: rgba(24, 183, 107, 0.42);
        color: #0c6a40;
      }

      .option.incorrect {
        background: var(--danger-soft);
        border-color: rgba(239, 74, 89, 0.42);
        color: #9b1f2f;
      }

      .option:disabled {
        cursor: default;
        opacity: 1;
      }

      .feedback {
        opacity: 0;
        transform: translateY(8px);
        min-height: 28px;
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        text-align: center;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .feedback.show {
        opacity: 1;
        transform: translateY(0);
      }

      .feedback.correct {
        background: var(--success-soft);
        color: #0d6d3f;
      }

      .feedback.incorrect {
        background: var(--danger-soft);
        color: #9b1f2f;
      }

      .shake {
        animation: shake 0.42s ease-in-out;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        18% { transform: translateX(-8px); }
        36% { transform: translateX(8px); }
        54% { transform: translateX(-6px); }
        72% { transform: translateX(6px); }
      }

      .result-screen {
        display: none;
        padding: 24px 20px 22px;
      }

      .result-screen.show {
        display: block;
      }

      .emoji {
        display: block;
        text-align: center;
        font-size: clamp(2.8rem, 7vw, 4.4rem);
        margin-bottom: 12px;
        filter: drop-shadow(0 8px 18px rgba(0,0,0,0.12));
      }

      .result-title {
        margin: 0 0 8px;
        text-align: center;
        letter-spacing: -0.04em;
        font-size: clamp(1.7rem, 4vw, 2.3rem);
      }

      .result-score {
        margin-bottom: 14px;
        text-align: center;
        color: var(--muted);
        font-weight: 700;
      }

      .result-message {
        max-width: 300px;
        margin: 0 auto 20px;
        text-align: center;
        line-height: 1.5;
      }

      .restart {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 14px 16px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
        color: white;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.2s ease;
      }

      .restart:hover {
        transform: translateY(-1px);
        filter: brightness(1.04);
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="card" aria-live="polite">
        <header class="header">
          <div class="meta">
            <div class="pill">🚀 Exploración espacial</div>
            <div class="score" id="scoreLabel">Puntuación: 0</div>
          </div>
          <div class="progress-wrap" aria-label="Progreso del cuestionario">
            <div class="progress-bar" id="progressBar"></div>
          </div>
        </header>

        <div class="content" id="quizContent">
          <h1 class="question-title" id="questionText">Pregunta</h1>
          <div class="options" id="optionsContainer"></div>
          <div class="feedback" id="feedbackBox" role="status" aria-live="polite"></div>
        </div>

        <div class="result-screen" id="resultScreen">
          <div class="emoji" id="finalEmoji" aria-hidden="true">🚀</div>
          <h2 class="result-title" id="resultTitle">¡Completado!</h2>
          <p class="result-score" id="resultScore">Has obtenido 0/10</p>
          <p class="result-message" id="resultMessage">¡Sigue soñando con las estrellas!</p>
          <button class="restart" id="restartBtn" type="button">Repetir cuestionario</button>
        </div>
      </section>
    </main>

    <script>
      const questions = [
        {
          question: '¿Cuál es el nombre del primer satélite artificial lanzado por la Tierra?',
          options: ['Voyager 1', 'Sputnik 1', 'Explorer 1', 'Hubble'],
          answer: 1
        },
        {
          question: '¿Qué planeta del sistema solar es conocido como el planeta rojo?',
          options: ['Venus', 'Marte', 'Júpiter', 'Mercurio'],
          answer: 1
        },
        {
          question: '¿Qué misión llevó a seres humanos a la Luna?',
          options: ['Apolo 11', 'Gemini 4', 'Mercury 7', 'Challenger'],
          answer: 0
        },
        {
          question: '¿Cuál es la estrella más cercana a la Tierra?',
          options: ['Sirio', 'Betelgeuse', 'Sol', 'Proxima Centauri'],
          answer: 2
        },
        {
          question: '¿Qué fuerza mantiene a los planetas en órbita alrededor del Sol?',
          options: ['Magnetismo', 'Fricción', 'Gravedad', 'Radiación'],
          answer: 2
        },
        {
          question: '¿Qué telescopio espacial se lanzó para observar en infrarrojos?',
          options: ['Kepler', 'James Webb', 'Spitzer', 'Cassini'],
          answer: 2
        },
        {
          question: '¿Cuál es el nombre del planeta más grande del sistema solar?',
          options: ['Saturno', 'Júpiter', 'Neptuno', 'Urano'],
          answer: 1
        },
        {
          question: '¿Qué astro es conocido por tener anillos visibles?',
          options: ['Venus', 'Marte', 'Saturno', 'Mercurio'],
          answer: 2
        },
        {
          question: '¿Qué es una galaxia?',
          options: ['Una estrella con órbita propia', 'Un conjunto enorme de estrellas, gas y polvo', 'Un planeta con satélites', 'Una nube de cometas'],
          answer: 1
        },
        {
          question: '¿Qué nombre recibe el conjunto formado por el Sol y los cuerpos que orbitan a su alrededor?',
          options: ['Cinturón de Kuiper', 'Sistema solar', 'Nebulosa', 'Vía Láctea'],
          answer: 1
        }
      ];

      const quizContent = document.getElementById('quizContent');
      const questionText = document.getElementById('questionText');
      const optionsContainer = document.getElementById('optionsContainer');
      const feedbackBox = document.getElementById('feedbackBox');
      const progressBar = document.getElementById('progressBar');
      const scoreLabel = document.getElementById('scoreLabel');
      const resultScreen = document.getElementById('resultScreen');
      const finalEmoji = document.getElementById('finalEmoji');
      const resultTitle = document.getElementById('resultTitle');
      const resultScore = document.getElementById('resultScore');
      const resultMessage = document.getElementById('resultMessage');
      const restartBtn = document.getElementById('restartBtn');

      let currentIndex = 0;
      let score = 0;
      let answered = false;

      function renderQuestion() {
        answered = false;
        const question = questions[currentIndex];
        questionText.textContent = `${currentIndex + 1}. ${question.question}`;
        optionsContainer.innerHTML = '';
        feedbackBox.className = 'feedback';
        feedbackBox.textContent = '';

        question.options.forEach((option, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'option';
          button.textContent = option;
          button.setAttribute('aria-label', `Respuesta ${index + 1}: ${option}`);
          button.addEventListener('click', () => handleAnswer(index, button));
          optionsContainer.appendChild(button);
        });

        const progressPercent = (currentIndex / questions.length) * 100;
        progressBar.style.width = `${progressPercent}%`;
        scoreLabel.textContent = `Puntuación: ${score}`;
      }

      function handleAnswer(selectedIndex, buttonElement) {
        if (answered) return;
        answered = true;

        const question = questions[currentIndex];
        const buttons = [...optionsContainer.querySelectorAll('.option')];

        buttons.forEach((btn, index) => {
          btn.disabled = true;
          if (index === question.answer) btn.classList.add('correct');
          if (index === selectedIndex && selectedIndex !== question.answer) btn.classList.add('incorrect');
        });

        const isCorrect = selectedIndex === question.answer;

        if (isCorrect) {
          score += 1;
          scoreLabel.textContent = `Puntuación: ${score}`;
          feedbackBox.textContent = '¡Correcto! ✅';
          feedbackBox.classList.add('correct', 'show');
        } else {
          buttonElement.classList.add('shake');
          feedbackBox.textContent = `¡Incorrecto! La correcta era: ${question.options[question.answer]}.`;
          feedbackBox.classList.add('incorrect', 'show');
        }

        const nextDelay = isCorrect ? 900 : 1200;
        setTimeout(() => {
          currentIndex += 1;
          if (currentIndex < questions.length) {
            renderQuestion();
          } else {
            showResults();
          }
        }, nextDelay);
      }

      function showResults() {
        quizContent.style.display = 'none';
        resultScreen.classList.add('show');

        const percentage = (score / questions.length) * 100;

        let emoji = '🚀';
        let title = '¡Muy bien!';
        let message = 'Has demostrado gran interés por explorar el universo.';

        if (percentage === 100) {
          emoji = '🏆';
          title = '¡Perfecto!';
          message = 'Eres un auténtico astronauta del conocimiento.';
        } else if (percentage >= 80) {
          emoji = '🌠';
          title = '¡Excelente!';
          message = 'Tu nivel espacial es realmente impresionante.';
        } else if (percentage >= 60) {
          emoji = '🪐';
          title = '¡Buen trabajo!';
          message = 'Estás muy cerca de convertirte en un experto del cosmos.';
        } else if (percentage >= 40) {
          emoji = '🌙';
          title = '¡Sigue así!';
          message = 'Cada respuesta te acerca más a dominar el espacio.';
        } else if (percentage >= 20) {
          emoji = '🌍';
          title = '¡No te rindas!';
          message = 'La curiosidad es el primer paso para llegar lejos.';
        } else {
          emoji = '🛰️';
          title = '¡Otra oportunidad!';
          message = 'El universo sigue esperando que vuelvas a intentarlo.';
        }

        finalEmoji.textContent = emoji;
        resultTitle.textContent = title;
        resultScore.textContent = `Has obtenido ${score}/${questions.length}`;
        resultMessage.textContent = message;
        progressBar.style.width = '100%';
      }

      function restartQuiz() {
        currentIndex = 0;
        score = 0;
        answered = false;
        resultScreen.classList.remove('show');
        quizContent.style.display = 'block';
        progressBar.style.width = '0%';
        renderQuestion();
      }

      restartBtn.addEventListener('click', restartQuiz);
      renderQuestion();
    </script>
  </body>
</html>
