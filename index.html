document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

.55;\n    -webkit-font-smoothing:antialiased;\n    overflow-x:hidden;\n  }\n  a{color:inherit;text-decoration:none}\n  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}\n  img{display:block;max-width:100%}\n\n  /* ───── ambient grid ───── */\n  body::before{\n    content:\"\";\n    position:fixed; inset:0;\n    background-image:\n      radial-gradient(circle at 50% 50%, rgba(136,146,164,.12) 1px, transparent 1.2px);\n    background-size: 28px 28px;\n    background-position: 0 0;\n    mask-image: radial-gradient(ellipse at 50% 30%, #000 0%, #000 40%, transparent 80%);\n    -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 0%, #000 40%, transparent 80%);\n    pointer-events:none;\n    z-index:0;\n    opacity:.7;\n  }\n\n  .container{\n    width:min(1200px, 92vw);\n    margin:0 auto;\n    position:relative;\n    z-index:1;\n  }\n\n  /* ───── nav ───── */\n  .nav{\n    position:sticky; top:0; z-index:50;\n    background: rgba(10,15,30,.65);\n    backdrop-filter: blur(14px) saturate(140%);\n    -webkit-backdrop-filter: blur(14px) saturate(140%);\n    border-bottom:1px solid var(--line);\n  }\n  .nav-inner{\n    display:flex; align-items:center; justify-content:space-between;\n    height:68px;\n  }\n  .logo{\n    display:flex; align-items:center; gap:1px;\n    font-family:var(--display);\n    font-weight:700; font-size:22px; letter-spacing:-.01em;\n  }\n  .logo .v{\n    color:var(--green);\n    font-weight:700;\n    text-shadow: 0 0 18px var(--green-glow);\n  }\n  .logo-img{\n    height: 36px;\n    width:auto;\n    display:block;\n    /* Lift dark-blue wordmark for dark-theme legibility */\n    filter: brightness(1.7) contrast(1.05);\n  }\n  .foot-brand .logo-img{ height: 44px }\n  .nav-links{\n    display:flex; align-items:center; gap:34px;\n  }\n  .nav-links a{\n    font-size:14px; color:var(--gray);\n    transition: color .2s ease;\n    position:relative;\n  }\n  .nav-links a:hover{ color:var(--white) }\n  .nav-links a::after{\n 099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z\"><\u002Fpath><\u002Fsvg>\n      Hablar por WhatsApp\n    <\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ───── FOOTER ───── -->\n<footer>\n  <div class=\"container\">\n    <div class=\"foot\">\n      <div class=\"foot-brand\">\n        <div class=\"logo\"><img src=\"f71cc2b7-ea91-4110-9cda-90a9a52e8287\" alt=\"Velozia\" class=\"logo-img\"><\u002Fdiv>\n        <p class=\"tagline\">Potencia tu negocio, acelera tu futuro. Automatización, IA y optimización para empresas que no se conforman.<\u002Fp>\n      <\u002Fdiv>\n      <nav class=\"foot-links\" aria-label=\"Footer\">\n        <a href=\"#servicios\">Servicios<\u002Fa>\n        <a href=\"#proceso\">Proceso<\u002Fa>\n        <a href=\"#nosotros\">Nosotros<\u002Fa>\n        <a href=\"#contacto\">Contacto<\u002Fa>\n        <a href=\"https://wa.me/593991551261?text=Hola%20Velozia%2C%20me%20interesa%20una%20consulta\" target=\"_blank\" rel=\"noopener\">WhatsApp<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n    <div class=\"foot-bottom\">\n      <span>© 2026 VELOZIA · GUAYAQUIL, ECUADOR<\u002Fspan>\n      <span>BUILT WITH PRECISION · v.2026.04<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  /* ─── Hero canvas: dot grid + flowing data lines ─── */\n  (function(){\n    const cv = document.getElementById('heroCanvas');\n    if(!cv) return;\n    const ctx = cv.getContext('2d');\n    let w, h, dpr, dots = [], lines = [];\n    const SPACING = 38;\n\n    function resize(){\n      dpr = Math.min(window.devicePixelRatio || 1, 2);\n      const rect = cv.getBoundingClientRect();\n      w = rect.width; h = rect.height;\n      cv.width = w * dpr; cv.height = h * dpr;\n      ctx.setTransform(dpr,0,0,dpr,0,0);\n      buildDots();\n    }\n    function buildDots(){\n      dots = [];\n      const cols = Math.ceil(w / SPACING) + 2;\n      const rows = Math.ceil(h / SPACING) + 2;\n      for(let y=0; y<rows; y++){\n        for(let x=0; x<cols; x++){\n          dots.push({\n            x: x*SPACING,\n            y: y*SPACING,\n            phase: Math.random()*Math.PI*2\n          });\n        }\n      }\n    }\n    function spawnLine(){\n      const horizontal = Math.random() > 0.4;\n      const speed = 0.6 + Math.random()*0.8;\n      if(horizontal){\n        const y = Math.floor(Math.random() * (h/SPACING)) * SPACING;\n        lines.push({\n          x: -120, y, vx: speed*60, vy: 0,\n          len: 80 + Math.random()*120,\n          life: 0, max: 4 + Math.random()*2\n        });\n      }else{\n        const x = Math.floor(Math.random() * (w/SPACING)) * SPACING;\n        lines.push({\n          x, y: -120, vx: 0, vy: speed*60,\n          len: 60 + Math.random()*100,\n          life: 0, max: 4 + Math.random()*2\n        });\n      }\n    }\n\n    let last = performance.now();\n    let lineTimer = 0;\n    let mouseX = -9999, mouseY = -9999;\n\n    cv.addEventListener('mousemove', e=>{\n      const r = cv.getBoundingClientRect();\n      mouseX = e.clientX - r.left;\n      mouseY = e.clientY - r.top;\n    });\n    cv.addEventListener('mouseleave', ()=>{ mouseX = -9999; mouseY = -9999 });\n\n    function draw(now){\n      const dt = Math.min(0.05, (now-last)/1000); last = now;\n      ctx.clearRect(0,0,w,h);\n\n      // dots\n      for(const d of dots){\n        d.phase += dt * 0.6;\n        const dx = d.x - mouseX, dy = d.y - mouseY;\n        const dist = Math.sqrt(dx*dx + dy*dy);\n        const near = Math.max(0, 1 - dist/180);\n        const baseA = 0.18 + Math.sin(d.phase + d.x*0.01)*0.06;\n        const a = baseA + near*0.6;\n        const r = 1 + near*1.4;\n        ctx.beginPath();\n        if(near > 0.2){\n          ctx.fillStyle = `rgba(58,158,47,${0.3 + near*0.6})`;\n        }else{\n          ctx.fillStyle = `rgba(136,146,164,${a})`;\n        }\n        ctx.arc(d.x, d.y, r, 0, Math.PI*2);\n        ctx.fill();\n      }\n\n      // data lines\n      lineTimer += dt;\n      if(lineTimer > 0.45 && lines.length < 14){\n        spawnLine(); lineTimer = 0;\n      }\n      for(let i=lines.length-1; i>=0; i--){\n        const l = lines[i];\n        l.x += l.vx*dt; l.y += l.vy*dt; l.life += dt;\n        if(l.life > l.max || l.x > w+200 || l.y > h+200){\n          lines.splice(i,1); continue;\n        }\n        // gradient stroke\n        const x2 = l.x - (l.vx>0 ? l.len : 0) - (l.vx<0 ? -l.len : 0);\n        const y2 = l.y - (l.vy>0 ? l.len : 0);\n        const grad = ctx.createLinearGradient(l.x, l.y, x2, y2);\n        grad.addColorStop(0, 'rgba(58,158,47,0.85)');\n        grad.addColorStop(1, 'rgba(58,158,47,0)');\n        ctx.strokeStyle = grad;\n        ctx.lineWidth = 1.4;\n        ctx.beginPath();\n        ctx.moveTo(l.x, l.y);\n        ctx.lineTo(x2, y2);\n        ctx.stroke();\n\n        // head\n        ctx.fillStyle = 'rgba(72,196,58,0.9)';\n        ctx.shadowColor = 'rgba(58,158,47,0.9)';\n        ctx.shadowBlur = 8;\n        ctx.beginPath(); ctx.arc(l.x, l.y, 1.6, 0, Math.PI*2); ctx.fill();\n        ctx.shadowBlur = 0;\n      }\n\n      requestAnimationFrame(draw);\n    }\n    window.addEventListener('resize', resize);\n    resize();\n    requestAnimationFrame(draw);\n  })();\n\n  /* ─── Reveal on scroll ─── */\n  const io = new IntersectionObserver((entries)=>{\n    for(const e of entries){\n      if(e.isIntersecting){\n        e.target.classList.add('in');\n        io.unobserve(e.target);\n      }\n    }\n  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });\n  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));\n\n  /* ─── Animated counters ─── */\n  const counterIO = new IntersectionObserver((entries)=>{\n    for(const e of entries){\n      if(!e.isIntersecting) continue;\n      const el = e.target;\n      const target = parseFloat(el.dataset.target);\n      const dur = 1600;\n      const start = performance.now();\n      function tick(now){\n        const t = Math.min(1, (now-start)/dur);\n        const eased = 1 - Math.pow(1-t, 3);\n        el.textContent = Math.round(target * eased);\n        if(t<1) requestAnimationFrame(tick);\n        else el.textContent = target;\n      }\n      requestAnimationFrame(tick);\n      counterIO.unobserve(el);\n    }\n  }, { threshold: 0.6 });\n  document.querySelectorAll('.num').forEach(el=>counterIO.observe(el));\n\n  /* ─── Timeline progress + step activation ─── */\n  const tl = document.getElementById('timeline');\n  if(tl){\n    const tio = new IntersectionObserver((entries)=>{\n      for(const e of entries){\n        if(!e.isIntersecting) continue;\n        tl.style.setProperty('--progress', '100%');\n        const steps = tl.querySelectorAll('.step');\n        steps.forEach((s,i)=>{\n          setTimeout(()=>s.classList.add('in'), 180 + i*240);\n        });\n        tio.unobserve(tl);\n      }\n    }, { threshold: 0.35 });\n    tio.observe(tl);\n  }\n\n  /* ─── Service card pointer glow ─── */\n  document.querySelectorAll('.card').forEach(card=>{\n    card.addEventListener('pointermove', e=>{\n      const r = card.getBoundingClientRect();\n      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');\n      card.style.setProperty('--my', (e.clientY - r.top) + 'px');\n    });\n  });\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
